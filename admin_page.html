tly.","foundingDate":"2025","foundingLocation":{"@type":"Place","name":"Algeria"},"contactPoint":{"@type":"ContactPoint","email":"dzeriagency@gmail.com","contactType":"customer service","areaServed":"DZ","availableLanguage":["Arabic","French","English"]},"sameAs":["https://www.linkedin.com/company/dzstore-org","https://www.facebook.com/people/Dzstore/61584129634637/","https://www.instagram.com/dzstore_org/","https://www.tiktok.com/@dzstoreapp"]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"DzStore","alternateName":["Dz Store","DZ Store","دي زد ستور"],"url":"https://dzstore.org","description":"DzStore is a SaaS e-commerce platform (like Shopify) built specifically for Algerian businesses. Merchants sign up and create their own professional online stores for free with local payment methods, Arabic and French support, and delivery across all 69 wilayas. DzStore is NOT a store — it is a platform for creating stores.","inLanguage":["ar","fr","en"],"publisher":{"@type":"Organization","name":"DzStore","url":"https://dzstore.org"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is DzStore?","acceptedAnswer":{"@type":"Answer","text":"DzStore is an e-commerce platform built specifically for businesses in Algeria. It allows anyone to create an online store for free with Cash on Delivery, Arabic and French languages, and nationwide delivery across all 69 wilayas."}},{"@type":"Question","name":"ما هو DzStore؟","acceptedAnswer":{"@type":"Answer","text":"DzStore هو متجر الكتروني جزائري مجاني — منصة تجارة إلكترونية مصممة خصيصاً للجزائر. يمكنك إنشاء متجرك الإلكتروني في ثوانٍ مع دعم الدفع عند الاستلام والتوصيل لجميع الولايات."}},{"@type":"Question","name":"Does DzStore offer a free plan?","acceptedAnswer":{"@type":"Answer","text":"Yes! DzStore will always be free. Create your store, add as many products as you like, and receive up to 3 orders per month at no cost, forever. No credit card required. Need unlimited orders? Upgrade to Pro anytime."}},{"@type":"Question","name":"كيف أنشئ متجر الكتروني جزائري مجاني؟","acceptedAnswer":{"@type":"Answer","text":"يمكنك إنشاء متجر الكتروني جزائري مجاني عبر DzStore (dzstore.org). سجّل مجاناً، اختر قالب متجرك، أضف منتجاتك، وابدأ البيع فوراً. DzStore يدعم الدفع عند الاستلام والتوصيل لكل ولايات الجزائر."}},{"@type":"Question","name":"Does DzStore charge commission on orders?","acceptedAnswer":{"@type":"Answer","text":"No. DzStore charges 0% commission on all plans — Free and Pro. You keep 100% of your sales revenue."}},{"@type":"Question","name":"How to start an online store in Algeria?","acceptedAnswer":{"@type":"Answer","text":"You can start an online store in Algeria using DzStore (dzstore.org). Simply sign up for free, choose a store theme, add your products, and start selling. DzStore handles payment methods popular in Algeria including Cash on Delivery."}},{"@type":"Question","name":"هل DzStore مجاني؟","acceptedAnswer":{"@type":"Answer","text":"نعم! DzStore مجاني للأبد. أنشئ متجرك الإلكتروني بمنتجات غير محدودة واستقبل 3 طلبات شهرياً بدون أي تكلفة. لا حاجة لبطاقة ائتمان. تحتاج أكثر؟ خطة PRO بـ 1,000 دج فقط خلال عرض الإطلاق (50٪ خصم على السعر العادي 2,000 دج) للحصول على كل شيء بدون حدود — وأوّل التجار يحتفظون بهذه التسعيرة مدى الحياة."}},{"@type":"Question","name":"What payment methods are available for Algerian online stores?","acceptedAnswer":{"@type":"Answer","text":"DzStore stores support Cash on Delivery — the most trusted payment method for e-commerce in Algeria. Customers pay the delivery person when they receive their order. More payment methods are coming in future updates."}},{"@type":"Question","name":"Is DzStore free?","acceptedAnswer":{"@type":"Answer","text":"Yes, DzStore will always be free. Create your online store with unlimited products and 3 orders per month at no cost, forever. Need more? The Pro plan is 1,000 DZD/month during the launch offer (50% off the regular 2,000 DZD/month) for unlimited everything — early adopters keep the launch price for life."}},{"@type":"Question","name":"Why is DzStore better than Shopify for Algeria?","acceptedAnswer":{"@type":"Answer","text":"DzStore is built specifically for Algeria — Cash on Delivery support, Arabic and French languages, delivery to all 69 wilayas, and local support. Unlike Shopify or other global platforms, everything works out of the box for Algerian merchants with pricing in Algerian Dinar."}},{"@type":"Question","name":"لماذا DzStore أفضل من Shopify في الجزائر؟","acceptedAnswer":{"@type":"Answer","text":"DzStore مصمم خصيصاً للجزائر — يدعم الدفع عند الاستلام، العربية والفرنسية، التوصيل لكل 69 ولاية، ودعم محلي. على عكس Shopify، كل شيء يعمل مباشرة للتجار الجزائريين بالدينار الجزائري وبدون رسوم عمولة."}},{"@type":"Question","name":"Do I need coding skills to use DzStore?","acceptedAnswer":{"@type":"Answer","text":"Not at all! DzStore is designed for everyone. Just pick a theme, add your products, and start selling. No technical knowledge required."}},{"@type":"Question","name":"Will I lose my data if my PRO subscription ends?","acceptedAnswer":{"@type":"Answer","text":"No. Your store, products, and orders stay exactly as they are — nothing is ever deleted. Your account simply returns to the Free plan, and you can renew anytime to unlock PRO features again."}},{"@type":"Question","name":"هل أفقد بياناتي إذا انتهى اشتراك PRO؟","acceptedAnswer":{"@type":"Answer","text":"لا. متجرك ومنتجاتك وطلباتك تبقى كما هي — لا نحذف أي شيء أبداً. حسابك يعود إلى الخطة المجانية فقط، ويمكنك التجديد في أي وقت لاستعادة مزايا PRO."}}]}</script><meta name="sentry-trace" content="cdebba13f08fae1196d6f15784614bc4-f8b08657c92c564a"/><meta name="baggage" content="sentry-environment=production,sentry-public_key=7df55aad0ffb3786417aa63479e4618e,sentry-trace_id=cdebba13f08fae1196d6f15784614bc4,sentry-org_id=4510619361804288"/><script src="/_next/static/chunks/a6dad97d9634a72d.js" "FAQPage\",\"mainEntity\":[{\"@type\":\"Question\",\"name\":\"What is DzStore?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"DzStore is an e-commerce platform built specifically for businesses in Algeria. It allows anyone to create an online store for free with Cash on Delivery, Arabic and French languages, and nationwide delivery across all 69 wilayas.\"}},{\"@type\":\"Question\",\"name\":\"ما هو DzStore؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"DzStore هو متجر الكتروني جزائري مجاني — منصة تجارة إلكترونية مصممة خصيصاً للجزائر. يمكنك إنشاء متجرك الإلكتروني في ثوانٍ مع دعم الدفع عند الاستلام والتوصيل لجميع الولايات.\"}},{\"@type\":\"Question\",\"name\":\"Does DzStore offer a free plan?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes! DzStore will always be free. Create your store, add as many products as you like, and receive up to 3 orders per month at no cost, forever. No credit card required. Need unlimited orders? Upgrade to Pro anytime.\"}},{\"@type\":\"Question\",\"name\":\"كيف أنشئ متجر الكتروني جزائري مجاني؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"يمكنك إنشاء متجر الكتروني جزائري مجاني عبر DzStore (dzstore.org). سجّل مجاناً، اختر قالب متجرك، أضف منتجاتك، وابدأ البيع فوراً. DzStore يدعم الدفع عند الاستلام والتوصيل لكل ولايات الجزائر.\"}},{\"@type\":\"Question\",\"name\":\"Does DzStore charge commission on orders?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"No. DzStore charges 0% commission on all plans — Free and Pro. You keep 100% of your sales revenue.\"}},{\"@type\":\"Question\",\"name\":\"How to start an online store in Algeria?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"You can start an online store in Algeria using DzStore (dzstore.org). Simply sign up for free, choose a store theme, add your products, and start selling. DzStore handles payment methods popular in Algeria including Cash on Delivery.\"}},{\"@type\":\"Question\",\"name\":\"هل DzStore مجاني؟\",\"acceptedAnswer\":{\"@type\":\"A hin hours, not days. Handle complaints professionally and offer returns when needed. Happy customers leave reviews and come back.\",\"title\":\"Provide Great Customer Service\"},\"customerTrust\":{\"description\":\"Display your contact info clearly and respond to messages quickly. Offer cash on delivery to reduce buyer hesitation. Share real customer reviews and testimonials.\",\"title\":\"Build Customer Trust\"},\"facebookGroups\":{\"description\":\"Join Facebook buy/sell groups in your wilaya (e.g. 'بيع و شراء الجزائر'). Share your products with prices and your store link. Be helpful, not spammy — answer questions and build trust.\",\"title\":\"Post in Facebook Groups\"},\"firstProduct\":{\"description\":\"Start by adding your best-selling product with a clear title, detailed description, and competitive price. Use the product page to upload images and set variants like size and color.\",\"title\":\"Add Your First Product\"},\"freeDelivery\":{\"description\":\"Free delivery removes the #1 hesitation for new buyers. Offer it for your first 10 customers or on orders above a certain amount. The cost is worth getting those first reviews.\",\"title\":\"Offer Free Delivery on First Order\"},\"postInstagram\":{\"description\":\"Create a simple Instagram post or story showing your products with your store link in bio. Use relevant Algerian hashtags like #shopping_dz #produits_algerie. Post at least 3 times your first week.\",\"title\":\"Post Your Store on Instagram\"},\"pricing\":{\"description\":\"Research your competitors' prices. Factor in your costs (product, shipping, fees) then add your margin. Consider offering bundle deals or quantity discounts to increase average order value.\",\"title\":\"Set Smart Prices\"},\"productPhotos\":{\"description\":\"Use natural lighting and a clean white background. Take photos from multiple angles. A good phone camera is enough — just make sure the photos are sharp and well-lit.\",\"title\":\"Take Better Product Photos\"},\"reviews\":{\"description\":\"After each successful delivery, ask customers to leave a review. Positive reviews build social proof and help new customers trust your store.\",\"title\":\"Collect Customer Reviews\"},\"scaling\":{\"description\":\"Once you have steady sales, consider expanding your product range. Use discounts to clear slow inventory. Reinvest profits into marketing and better product photography.\",\"title\":\"Scale Your Business\"},\"seo\":{\"description\":\"Write clear product titles with keywords customers actually search for. Add detailed descriptions and use categories to organize your products.\",\"title\":\"Optimize for Search\"},\"shareFamily\":{\"description\":\"Your first customers are the people who already trust you. Send your store link to family, friends, and neighbors on WhatsApp. Ask them to share it too. Word of mouth is the most powerful marketing in Algeria.\",\"title\":\"Share With Family \u0026 Friends\"},\"shipping\":{\"description\":\"Connect with reliable delivery carriers and set clear shipping rates. Offer free shipping above a threshold to encourage larger orders. Keep customers updated with tracking.\",\"title\":\"Optimize Shipping\"},\"socialMedia\":{\"description\":\"Share your products on Facebook, Instagram, and TikTok regularly. Post customer reviews, behind-the-scenes content, and limited-time offers to drive traffic to your store.\",\"title\":\"Promote on Social Media\"},\"storeDesign\":{\"description\":\"Choose a clean theme that matches your brand. Add your logo, pick consistent colors, and write an About page that tells your story. First impressions matter.\",\"title\":\"Design Your Store\"},\"targetWilaya\":{\"description\":\"Start selling in your own wilaya where delivery is fastest and cheapest. Fast delivery = happy customers = good reviews. Expand to other wilayas once you have a solid reputation.\",\"title\":\"Focus on Your Wilaya First\"},\"whatsappStatus\":{\"description\":\"Post your store link and best product ph ry.\",\"exportCsv\":\"Export CSV\",\"exporting\":\"Exporting…\",\"noOrders\":\"No orders to export yet.\",\"noProducts\":\"No products to export yet.\",\"exportFailed\":\"Export failed. Please try again.\",\"feedTitle\":\"Facebook \u0026 Instagram catalog\",\"feedDesc\":\"A live XML feed of your products. Paste the link into Commerce Manager and Facebook keeps your catalog in sync automatically.\",\"feedCopyLink\":\"Copy link\",\"feedCopied\":\"Link copied\"},\"dataExportTab\":\"Data Export\",\"allProducts\":\"All Products\",\"allCustomers\":\"All Customers\",\"analyticsOverview\":\"Overview\",\"deliveryRates\":\"Delivery Prices\",\"deliveryColumn\":\"Delivery\",\"deliveryHome\":\"Home\",\"preorderBadge\":\"Pre-order\",\"deliveryDesk\":\"Stop desk\"},\"discover\":{\"allCategories\":\"All\",\"badge\":\"Marketplace\",\"currency\":\"DA\",\"empty\":{\"description\":\"Be the first to create your store on DzStore!\",\"title\":\"No stores yet\"},\"emptyProducts\":{\"description\":\"Try a different search or browse all categories\",\"title\":\"No products found\"},\"products\":\"products\",\"searchPlaceholder\":\"Search products, stores...\",\"subtitle\":\"Browse independent stores and find unique products — with cash on delivery\",\"tabs\":{\"products\":\"Products\",\"stores\":\"Stores\"},\"title\":\"Marketplace — Stores \u0026 Products\",\"common\":{\"cashOnDelivery\":\"Cash on delivery\",\"soldBy\":\"Sold by\",\"orderNow\":\"Order now — Cash on delivery\",\"deliveryAllWilayas\":\"Delivery to all 69 wilayas\",\"description\":\"Description\",\"relatedProducts\":\"Related products\",\"backToDiscover\":\"Back to Marketplace\",\"previous\":\"Previous\",\"next\":\"Next\",\"pageOf\":\"Page {page} of {total}\",\"productsCount\":\"{count} products\",\"categories\":\"Categories\",\"browseByCategory\":\"Browse by category\",\"storesCount\":\"{count} stores\",\"featured\":\"Featured products\",\"featuredBadge\":\"Featured\"}},\"faqPage\":{\"backToHome\":\"Back to Home\",\"categories\":{\"ecommerceTips\":\"E-Commerce Tips\",\"gettingStarted\":\"Getting Started\",\"marketing\":\"Marketing \u0026 Growth\",\"platform\":\"About DzStore\",\"shipping\":\"Shipping \u0026 Delivery\"},\"cta\":{\"button\":\"Create Your Free Store\",\"subtitle\":\"Create your free store now and join thousands of merchants selling online.\",\"title\":\"Ready to Start Your E-Commerce Journey?\"},\"ecommerceTips\":[{\"question\":\"How do I succeed in e-commerce in Algeria?\",\"answer\":\"Success in Algerian e-commerce comes down to: 1) Choose a niche you understand, 2) Take high-quality product photos, 3) Write clear descriptions in Arabic and French, 4) Price competitively including delivery costs, 5) Respond to orders quickly (confirm within 1 hour), 6) Build trust through consistent delivery and good customer service, 7) Use social media (Instagram, Facebook) to drive traffic to your store.\"},{\"question\":\"How do I take good product photos?\",\"answer\":\"You don't need a professional camera — your smartphone is enough. Use natural daylight, a clean white background (a white sheet works), and take photos from multiple angles. Show the product being used if possible. Avoid filters that change the product's actual color.\"},{\"question\":\"How do I write product descriptions that sell?\",\"answer\":\"Focus on benefits, not just features. Instead of 'Cotton t-shirt, 100% cotton', write 'Soft, breathable cotton t-shirt that keeps you comfortable all day. Perfect for Algeria's hot summers.' Include size guides, materials, and care instructions. DzStore's AI can help you generate descriptions in Arabic and French.\"},{\"question\":\"How do I price my products correctly?\",\"answer\":\"Calculate your total cost: product cost + shipping to you + packaging + delivery fee to customer. Add your profit margin (usually 30-50% for physical products). Check competitor prices. Consider offering free delivery by building shipping costs into your product price — many Algerian customers prefer this.\"},{\"question\":\"How do I reduce fake orders and returns?\",\"answer\":\"DzStore has built-in fraud detection that flags suspicious orders. Additionally: 1) Always call to confirm before shipping, 2) Send clear product photos so customers know exactly what they're getting, 3) Be transparent about delivery times, 4) Use DzStore's customer flagging system to track repeat offenders across the platform.\"},{\"question\":\"How do I handle customer complaints?\",\"answer\":\"Respond quickly and professionally. Offer solutions (replacement, refund, discount on next order). Most complaints in Algerian e-commerce come from delivery delays or products not matching photos — prevent these by being accurate in descriptions and choosing reliable carriers.\"}],\"gettingStarted\":[{\"question\":\"How do I start an e-commerce business in Algeria?\",\"answer\":\"Starting e-commerce in Algeria is simpler than you think: 1) Sign up on DzStore for free, 2) Choose a theme and customize your store, 3) Add your products with photos and prices, 4) Share your store link on social media, 5) Start receiving orders! No legal paperwork needed to get started — you can register your business later as you grow.\"},{\"question\":\"How do I create my first online store?\",\"answer\":\"Sign up on DzStore, pick a store name and theme, then add your products. Your store will be live at yourname.dzstore.org in seconds. You can customize colors, add your logo, and configure shipping rates for each wilaya.\"},{\"question\":\"What products sell best online in Algeria?\",\"answer\":\"The most popular categories in Algerian e-commerce include: fashion and clothing, beauty and skincare products, electronics and accessories, home decor, handmade crafts, and food products. Choose products you know well and that solve a real problem for your customers.\"},{\"question\":\"How much money do I need to start?\",\"answer\":\"You can start with zero investment using DzStore's free plan. You don't need to hold inventory — many successful sellers use dropshipping or made-to-order models. Start small, reinvest your profits, and scale gradually.\"},{\"question\":\"How do I add products to my store?\",\"answer\":\"Go to your dashboard, click 'Add Product', upload photos, set a price, write a description (or use our AI to generate one), and publish. You can add variants (sizes, colors), set stock levels, and organize products into categories.\"},{\"question\":\"Can I import products from another platform?\",\"answer\":\"Yes! DzStore supports importing from WooCommerce, Shopify, and YouCan via CSV files. Go to Dashboard → Products → Import and follow the guided process. Your product images, descriptions, and prices will be migrated automatically.\"}],\"marketing\":[{\"question\":\"How do I get my first customers?\",\"answer\":\"Start with your personal network: share your store on WhatsApp, Facebook, and Instagram. Create content showing your products in use. Join Algerian buy/sell groups on Facebook. Consider running small Facebook or Instagram ads (even 500 DZD/day can bring results). Word of mouth is powerful — deliver great service and your customers will refer others.\"},{\"question\":\"How do I use Instagram to sell products?\",\"answer\":\"Post high-quality photos daily, use Instagram Stories and Reels to show behind-the-scenes content, add your DzStore link in your bio, use relevant Algerian hashtags (#shopping_dz, #mode_algerie, etc.), and respond to DMs quickly. Many successful Algerian sellers get 80% of their traffic from Instagram.\"},{\"question\":\"How do I use Facebook ads for my store?\",\"answer\":\"Start small: create a Facebook page for your store, run Product Catalog ads targeting Algerian users interested in your niche. Set a daily budget of 500-1000 DZD, target by wilaya and age group. DzStore supports Facebook Pixel integration so you can track conversions and optimize your ads.\"},{\"question\":\"How do I recover abandoned carts?\",\"answer\":\"DzStore automatically tracks abandoned carts. You can see customers who added products but didn't complete checkout. Follow up via WhatsApp or SMS within a few hours. Offer a small discount or free shipping to close the sale. Studies show that 30-40% of abandoned carts can be recovered with timely follow-up.\"},{\"question\":\"How do I build customer loyalty?\",\"answer\":\"Deliver consistently, package products nicely (small touches like a thank you card go far), respond quickly to messages, offer discounts to repeat customers, and create a brand identity (consistent colors, logo, packaging). Happy customers become repeat buyers and refer their friends.\"},{\"question\":\"Will DzStore get me sales?\",\"answer\":\"DzStore gives you everything you need to sell: a professional store built in seconds, and a free listing in our marketplace where shoppers can find you. But sales come from getting your products in front of customers — and that part is in your hands. You bring the marketing (social media, ads, sharing your store link); we give you the tools, the platform, and tips to help you succeed. Think of DzStore as your shop on the best street in town — we build it and put you on the map, but you still invite the customers in.\"}],\"platform\":[{\"question\":\"Does DzStore offer a free plan?\",\"answer\":\"Yes! DzStore will always be free — create your store, add as many products as you like, and receive up to 3 orders per month at no cost, forever. No credit card required. Need unlimited orders? Upgrade to Pro anytime.\"},{\"question\":\"Does DzStore charge commission on orders?\",\"answer\":\"No. DzStore charges 0% commission on all plans — Free and Pro. You keep 100% of your sales revenue.\"},{\"question\":\"How do subscriptions work?\",\"answer\":\"The Pro plan is 1,000 DZD/month during our launch offer — 50% off the regular 2,000 DZD/month. Early adopters keep this launch price for life. Payment is accepted via BaridiMob, CCP, or bank transfer. You can cancel anytime.\"},{\"question\":\"What payment methods can my customers use?\",\"answer\":\"Your store customers currently pay via Cash on Delivery — the most trusted payment method in Algeria. They pay the delivery person when they receive their order. More payment methods are coming in future updates.\"},{\"question\":\"Is my store data safe and private?\",\"answer\":\"Absolutely. Your store data, customer information, and sales are completely private and secure. We use industry-standard encryption and never share your data with third parties.\"},{\"question\":\"Do I need coding or design skills?\",\"answer\":\"Not at all! DzStore is designed for everyone. Just pick a theme, add your products, and start selling. No technical knowledge required.\"},{\"question\":\"Why is DzStore better than other platforms?\",\"answer\":\"DzStore is built specifically for Algeria — Cash on Delivery support, Arabic/French/English languages, delivery to all 69 wilayas, and local support. Unlike Shopify or other global platforms, everything works out of the box for Algerian merchants.\"},{\"question\":\"What URL does my store get?\",\"answer\":\"Every store gets a free subdomain (yourstore.dzstore.org) with SSL included. This gives your store a professional look and helps with branding.\"},{\"question\":\"Will I lose my data if my PRO subscription ends?\",\"answer\":\"No. Your store, products, and orders stay exactly as they are — nothing is ever deleted. Your account simply returns to the Free plan: you keep receiving orders, and customer phone numbers are hidden only for orders beyond the free monthly limit until you renew. Renew anytime to unlock everything again.\"},{\"question\":\"Is DzStore optimized for Algerian customers?\",\"answer\":\"Yes! DzStore is designed around how Algerians shop online — Cash on Delivery, mobile-first design, Arabic, French, and English interfaces, and delivery coverage across all wilayas.\"}],\"shipping\":[{\"question\":\"How does shipping work in Algeria?\",\"answer\":\"DzStore integrates with +60 Algerian carriers — Yalidine, Maystro, ZR Express, Guepex and the entire EcoTrack family (plus Custom EcoTrack for any not pre-listed). When you confirm an order, you can create a shipment directly from your dashboard. The carrier picks up the package and delivers it to the customer across any of Algeria's 69 wilayas.\"},{\"question\":\"How much does delivery cost?\",\"answer\":\"Delivery prices vary by carrier and destination wilaya, typically 400-800 DZD for home delivery and 200-500 DZD for stop-desk. You can set custom shipping rates per wilaya in your DzStore dashboard, or offer free shipping above a certain order amount to boost sales.\"},{\"question\":\"How do I choose the right delivery company?\",\"answer\":\"Consider: coverage area (do they deliver to your customers' wilayas?), price, speed, and reliability. Many merchants use 2-3 carriers to get the best coverage. Start with Yalidine or Maystro for nationwide coverage, then add specialized local carriers as needed.\"},{\"question\":\"What if a delivery fails or the customer refuses the package?\",\"answer\":\"If a customer refuses delivery, the carrier returns the package to you. To minimize returns: always confirm orders by phone before shipping, provide accurate delivery estimates, and send tracking updates. DzStore shows you return rates so you can identify and address patterns.\"}],\"subtitle\":\"Answers to common questions plus tips to help you succeed in e-commerce in Algeria\",\"title\":\"FAQ \u0026\",\"titleHighlight\":\"E-Commerce Guides\"},\"features\":{\"cta\":{\"button\":\"Create your free store\",\"description\":\"Create your free store now and start selling online with DzStore.\",\"title\":\"Ready to start selling?\"},\"mainFeatures\":{\"items\":{\"analytics\":{\"bullets\":[\"Track sales, orders and revenue\",\"See your best-selling products\",\"Watch customer activity in real time\"],\"description\":\"Know exactly where your business stands: how much y an market well. We help anytime.\",\"title\":\"Local support 24/7\"},\"fraud\":{\"title\":\"Fake-order protection\",\"description\":\"A fake order means you pay for delivery on a parcel that comes back. The system checks every new customer's phone and alerts you to suspicious customers and repeat fake orders, so you stop wasting money on returns.\",\"bullets\":[\"Automatic check of every new customer's phone\",\"Alerts on suspicious customers and repeat fake orders\",\"Protects your delivery costs from returned parcels\"]}},\"subtitle\":\"Everything that makes selling online in Algeria simple and fast — without the hassle.\",\"title\":\"Core features\"},\"moreFeatures\":{\"items\":{\"ai\":{\"description\":\"No time to write a description for every product? The built-in AI writes copy that sells, in Arabic, French and English, in seconds.\",\"title\":\"AI tools\"},\"customers\":{\"description\":\"All your customers in one place — order history, phone numbers, and what they buy most — so you know your best customers and sell to them again.\",\"title\":\"Customer management\"},\"mobile\":{\"description\":\"Your store looks perfect on phones and tablets — where most Algerians shop, not at a computer.\",\"title\":\"Mobile-friendly\"},\"orders\":{\"description\":\"Follow every order from purchase to the customer's hands: change status, handle returns, and get an instant alert on every new order.\",\"title\":\"Order management\"},\"seo\":{\"description\":\"Built-in search optimization, so when a customer looks for your product on Google they find your store — not someone else's.\",\"title\":\"Search-ready\"},\"themes\":{\"description\":\"Pick from 4 elegant, mobile-perfect themes designed for every kind of store — fashion, food, electronics and more — and arrange your storefront by dragging.\",\"title\":\"4 professional themes\"},\"inventory\":{\"title\":\"Inventory tracking\",\"description\":\"Know what you have left at any moment — quantities drop automatically with each rt\",\"description\":\"Import products directly from your Instagram posts — photos, captions, and prices in one click.\",\"category\":\"marketing\",\"status\":\"coming_soon\"},{\"name\":\"AI Landing Pages\",\"description\":\"Generate high-converting product landing pages optimized for Algerian buyers with AI.\",\"category\":\"ai\",\"status\":\"coming_soon\"},{\"name\":\"Email Marketing\",\"description\":\"Send campaigns, recover abandoned carts, and automate revenue with email marketing.\",\"category\":\"marketing\",\"status\":\"coming_soon\"},{\"name\":\"CCP / ECCP Payments\",\"description\":\"Enable CCP and electronic CCP (ECCP) payments — trusted by millions of Algerians.\",\"category\":\"payments\",\"status\":\"coming_soon\"},{\"name\":\"Multi-Currency Display\",\"description\":\"Show prices in DZD, EUR, and USD with automatic exchange rates for international customers.\",\"category\":\"payments\",\"status\":\"coming_soon\"}],\"subtitle\":\"Supercharge your store with powerful integrations and plugins. More coming soon!\",\"title\":\"Integrations \u0026\",\"titleHighlight\":\"Plugins\"},\"landingFeatures\":{\"label\":\"Platform features\",\"title\":\"Everything you need to sell in Algeria\",\"subtitle\":\"Cash on delivery, all 69 wilayas, and direct links to Yalidine, Maystro and 60+ carriers.\",\"analytics\":{\"label\":\"Analytics\",\"title\":\"Know how your store is doing\",\"desc\":\"Track your sales, orders and revenue, and spot your best-selling products — all on one clear dashboard.\"},\"orders\":{\"label\":\"Order management\",\"title\":\"Never miss an order\",\"desc\":\"You're alerted the moment a new order arrives. Confirm, prepare and track shipping from one place — from purchase to delivery.\"},\"cod\":{\"title\":\"Cash on delivery\",\"desc\":\"Your customer pays cash when the order arrives — the method Algerians trust. No bank card, no hassle.\"},\"multilang\":{\"title\":\"Arabic · French · English\",\"desc\":\"Your store in three languages: full Arabic, French and English — every page translates automatically so every customer understands.\"},\"wilayas\":{\"title\":\"All 69 wilayas\",\"desc\":\"Connected to Yalidine, Maystro and 60+ carriers — upload your parcels and track shipping automatically across all of Algeria.\",\"covered\":\"wilayas covered\"},\"setup\":{\"label\":\"Quick launch\",\"title\":\"Start selling in seconds\",\"desc\":\"No code, no complication: pick a theme, add your products, and start selling right away.\",\"minutes\":\"seconds\",\"live\":\"Store is live!\"},\"ai\":{\"title\":\"AI product descriptions\",\"desc\":\"Not sure what to write about your product? Let AI write a description that sells — in Arabic, French or English.\"},\"commission\":{\"title\":\"0% commission\",\"desc\":\"Keep 100% of every sale — DzStore never takes a cut of your revenue.\"},\"builder\":{\"title\":\"Your store, your way\",\"desc\":\"Design your storefront yourself — pick a theme, arrange your pages, add your logo. No code.\"},\"directOrders\":{\"title\":\"Orders 24/7 — no more DMs\",\"desc\":\"Customers order straight from your store, day and night — no back-and-forth Instagram or Facebook messages, no lost orders. You get the sale even while you sleep.\"},\"stock\":{\"title\":\"Stock management\",\"desc\":\"Track your inventory automatically — stock updates with every sale, and DzStore warns you before a product runs out.\"},\"customers\":{\"title\":\"Know your customers\",\"desc\":\"Every buyer saved in one place — see repeat customers, their orders and phone numbers, and bring them back.\"},\"support\":{\"title\":\"Fast support\",\"desc\":\"A real team that answers fast — get help whenever you're stuck, in Arabic, French or English.\"}},\"legal\":{\"privacy\":{\"changes\":{\"content\":\"We may update this Privacy Policy from time to time. Changes will be posted on this page with an updated date. We will notify you of material changes via email. Your continued use of our platform after changes constitutes acceptance of the updated policy.\",\"title\":\"Changes to This Policy\"},\"children\":{\"content\":\"Merchants must be at least 13 years old to create a store account. Store visitors and customers must be at least 13 years old to place orders. We do not knowingly collect personal data from children under 13. If we discover we have collected data from a child under 13, we will delete it immediately.\",\"title\":\"Children's Privacy\"},\"contact\":{\"content\":\"If you have questions about this Privacy Policy or your personal data, please contact us at support@dzstore.org. We are available 24/7.\",\"title\":\"Contact Us\"},\"cookies\":{\"content\":\"We use cookies and similar technologies for: authentication and session management; remembering your preferences (language, theme); analytics (Google Analytics, Vercel Analytics); and performance monitoring. You can control cookies through your browser settings. Disabling certain cookies may affect the functionality of our platform. Merchants may add their own tracking pixels (Facebook Pixel, TikTok Pixel, Google Analytics) to their stores.\",\"title\":\"Cookies and Tracking\"},\"customerData\":{\"content\":\"When customers place orders through DzStore-powered stores, we collect their name, phone number, delivery address (wilaya, commune, address), and order details. This data is shared with the merchant for order fulfillment. Customers do not create accounts on DzStore — orders are placed with basic contact information only.\",\"title\":\"Store Customer Data\"},\"dataCollection\":{\"content\":\"We collect information you provide directly: name, email address, phone number, and business information when you create an account. Store data including product information, images, and store settings. Order information including customer names, phone numbers, addresses, and order details. Payment proof screenshots for subscription payments. Technical data including IP addresses, browser type, device information, and usage patterns through cookies and analytics tools.\",\"title\":\"Information We Collect\"},\"dataSecurity\":{\"content\":\"We implement industry-standard security measures to protect your data, including: encrypted data transmission (HTTPS/TLS); secure password hashing; rate limiting and brute-force protection; regular security audits; access controls and authentication. However, no method of transmission over the Internet is 100% secure, and we cannot guarantee absolute security.\",\"title\":\"Data Security\"},\"dataTransfer\":{\"content\":\"In the event of a merger, acquisition, or sale of assets, your personal data may be transferred as part of that transaction. We will notify you via email before your personal data is transferred to another entity and becomes subject to a different privacy policy.\",\"title\":\"Data Transfer\"},\"dataUsage\":{\"content\":\"We use your information to: provide and maintain our platform services; process and manage your store and orders; send email notifications (order confirmations, shipping updates, account alerts); improve our services and develop new features; provide customer support; detect and prevent fraud; send marketing communications (with your consent, which you can withdraw at any time); and generate anonymous analytics to improve the platform.\",\"title\":\"How We Use Your Information\"},\"intro\":\"At DzStore, we take your privacy seriously. This Privacy Policy explains how we collect, use, protect, and share information when you use our platform at dzstore.org.\",\"lastUpdated\":\"Last updated: March 8, 2026\",\"lawEnforcement\":{\"content\":\"DzStore may be required to disclose your personal data in response to lawful requests by Algerian authorities, including courts or government agencies. We will make reasonable efforts to notify you of such requests unless legally prohibited from doing so.\",\"title\":\"Law Enforcement Disclosure\"},\"merchantData\":{\"content\":\"As a merchant, you are responsible for how you handle your customers' data. You agree to: only collect customer data necessary for order fulfillment; not sell or share customer data with third parties; handle customer data in compliance with applicable privacy laws; inform your customers about your own data practices. DzStore is not responsible for merchants' handling of customer data beyond our platform.\",\"title\":\"Merchant Data\"},\"retention\":{\"content\":\"We retain your data for as long as your account is active. If you delete your account, we will delete your personal data within 30 days, except where we are required by law to retain it. Order records may be retained for up to 5 years for legal compliance. Anonymous analytics data may be retained indefinitely.\",\"title\":\"Data Retention\"},\"rights\":{\"content\":\"You have the right to: access the personal data we hold about you; correct inaccurate personal data; request deletion of your personal data; export your data in a portable format; withdraw consent for marketing communications; and lodge a complaint with the relevant data protection authority. To exercise any of these rights, contact us at support@dzstore.org.\",\"title\":\"Your Rights\"},\"accountDeletion\":{\"content\":\"You can permanently delete your DzStore account and all of its data at any time. In the DzStore app or on the web dashboard at dzstore.org, open Settings and tap Delete Account, then confirm. This immediately and permanently deletes your account, your store, and everything linked to it — your products, orders, customers, and settings. Nothing is kept after deletion and the action cannot be undone. If you are unable to sign in, email us at support@dzstore.org from your registered address and we will delete your account and data for you.\",\"title\":\"Account \u0026 Data Deletion\"},\"thirdParty\":{\"content\":\"We use trusted third-party services that may process your data: Supabase for image storage; Resend for email delivery; Sentry for error monitoring; Vercel for hosting and analytics; Groq for AI-powered features. Each service has its own privacy policy. We only share the minimum data necessary for each service to function.\",\"title\":\"Third-Party Services\"},\"title\":\"Privacy Policy\"},\"refund\":{\"contact\":{\"content\":\"For refund inquiries, email support@dzstore.org with the subject line 'Refund Request' or 'Refund Inquiry'. We are available 24/7.\",\"title\":\"Contact Us\"},\"disputes\":{\"content\":\"If you disagree with a refund decision, you may appeal by replying to the refund response email with additional information. Appeals will be reviewed by a senior team member within 5 business days. For unresolved disputes, applicable Algerian consumer protection laws will govern the resolution process.\",\"title\":\"Dispute Resolution\"},\"eligibility\":{\"content\":\"You are eligible for a platform subscription refund if: you request it within 7 days of subscribing to a PRO plan; your account has not been terminated for Terms of Service violations; and you have not previously received a refund for the same subscription period. Refunds are not available for: partial months of service; accounts terminated due to policy violations; or the free plan (as no payment is involved).\",\"title\":\"Refund Eligibility (Platform Fees)\"},\"intro\":\"This Refund Policy outlines the terms for refunds on DzStore platform subscription fees and provides guidance on merchant-customer refund handling.\",\"lastUpdated\":\"Last updated: March 8, 2026\",\"merchantRefunds\":{\"content\":\"DzStore is a platform provider and is not a party to transactions between merchants and customers. Each merchant is responsible for setting and communicating their own refund policy to their customers. Merchants are encouraged to clearly display their refund policy on their store. DzStore does not process, mediate, or guarantee refunds for products purchased through merchant stores.\",\"title\":\"Merchant-Customer Refunds\"},\"nonRefundable\":{\"content\":\"The following are not eligible for refunds: subscription fees after the 7-day refund window; accounts terminated for Terms of Service violations; any free plan services; setup or onboarding assistance; custom development or consulting services; and any promotional or discounted subscriptions marked as non-refundable at the time of purchase.\",\"title\":\"Non-Refundable Items\"},\"platformFees\":{\"content\":\"DzStore PRO plan subscriptions are billed on a monthly or annual basis. If you are unsatisfied with the PRO plan, you may request a refund within the first 7 days of your subscription. After the 7-day period, subscription fees are non-refundable. Refunds are processed via the same payment method used for the original transaction (BaridiMob, CCP, or bank transfer) and may take 5-10 business days.\",\"title\":\"Platform Subscription Refunds\"},\"process\":{\"content\":\"To request a refund for platform fees: email support@dzstore.org with the subject line 'Refund Request'; include your account email, payment method, and reason for the refund; our team will review your request within 2 business days; if approved, the refund will be processed within 5-10 business days. For merchant-customer refund disputes, please contact the merchant directly.\",\"title\":\"How to Request a Refund\"},\"timeline\":{\"content\":\"Refund processing times: review of request takes 1-2 business days; BaridiMob refunds take 3-5 business days after approval; CCP refunds take 5-7 business days after approval; bank transfer refunds take 5-10 business days after approval. We operate 24/7.\",\"title\":\"Refund Timeline\"},\"title\":\"Refund Policy\"},\"terms\":{\"acceptance\":{\"content\":\"By creating an account, accessing, or using DzStore's services, you acknowledge that you have read, understood, and agree to be bound by these Terms. If you do not agree, you may not use our services. These terms apply to all users, including merchants, store visitors, and customers.\",\"title\":\"Acceptance of Terms\"},\"accounts\":{\"content\":\"You must provide accurate and complete information when creating your account. You are responsible for maintaining the security of your account credentials and for all activities that occur under your account. You must be at least 13 years old to create an account. One person may create multiple stores but must use a single account. You must notify us immediately of any unauthorized use of your account.\",\"title\":\"User Accounts\"},\"changes\":{\"content\":\"We reserve the right to modify these Terms at any time. Changes will be posted on this page with an updated date. Continued use of our services after changes constitutes acceptance of the new terms. For material changes, we will notify you via email at least 30 days before the changes take effect.\",\"title\":\"Changes to Terms\"},\"contact\":{\"content\":\"If you have questions about these Terms of Service, please contact us at support@dzstore.org. We are available 24/7.\",\"title\":\"Contact Us\"},\"intellectualProperty\":{\"content\":\"DzStore and its original content, features, and functionality are owned by DzStore and are protected by applicable intellectual property laws. The DzStore name, logo, and branding may not be used without our written consent. Merchants retain ownership of their product content, images, and store branding. By uploading content to DzStore, you grant us a non-exclusive license to display and distribute that content as part of providing our services.\",\"title\":\"Intellectual Property\"},\"intro\":\"Welcome to DzStore. By accessing or using our platform at dzstore.org, you agree to be bound by these Terms of Service. Please read them carefully before using our services.\",\"lastUpdated\":\"Last updated: June 24, 2026\",\"liability\":{\"content\":\"DzStore is provided 'as is' without warranties of any kind. We are not responsible for transactions between merchants and their customers, the quality or legality of products sold by merchants, delivery or shipping issues, payment disputes between merchants and customers, or any indirect, incidental, or consequential damages. Our total liability shall not exceed the amount paid by you for our services in the 12 months preceding the claim.\",\"title\":\"Limitation of Liability\"},\"merchantObligations\":{\"content\":\"As a merchant on DzStore, you agree to: sell only legal products permitted under Algerian law; provide accurate product descriptions, images, and pricing in Algerian Dinar (DZD); fulfill orders in a timely manner; respond to customer inquiries within 48 hours; comply with all applicable Algerian commercial regulations; maintain accurate business information on your store; and handle customer data responsibly and in accordance with our Privacy Policy.\",\"title\":\"Merchant Obligations\"},\"payments\":{\"content\":\"$20\",\"title\":\"Payments and Fees\"},\"prohibitedContent\":{\"content\":\"You may not sell, list, or promote any products that are illegal or restricted under Algerian law, or that violate public morality. This includes, without limitation: weapons and firearms; drugs, narcotics, and controlled substances; counterfeit, replica, or stolen goods; sexually explicit products and adult toys; products that infringe intellectual property rights; content that promotes violence, hatred, or discrimination; and any other goods prohibited or restricted by Algerian law or authorities. Any store found selling prohibited products will be suspended or permanently removed, and DzStore reserves the right to take such action without prior notice and to report violations to the authorities. DzStore does not host, facilitate, or process payments for the sale of illegal goods, in any form, including via a direct store link. This policy protects the platform and our merchants from legal liability — we act only on a clear violation of these rules.\",\"title\":\"Prohibited Content and Activities\"},\"marketplaceCuration\":{\"content\":\"The marketplace is a shared storefront shown to every visitor, so DzStore curates what appears in it — the same way any large retailer arranges its window display. Not appearing in the marketplace is neither a judgment on a product nor a ban: every legal product sells normally through DzStore, and its store keeps working fully via its direct link, search engines, and its social media pages. Some categories — underwear, for example — sell perfectly normally from their own store and may simply not be shown in the shared window. Marketplace placement remains at DzStore's sole discretion.\",\"title\":\"Marketplace Curation\"},\"services\":{\"content\":\"DzStore provides an e-commerce platform that enables Algerian merchants to create online stores, manage products, process orders, and sell goods. Our services include store creation and hosting on dzstore.org subdomains, product management tools, order processing and management, theme customization, AI-powered description generation, analytics and reporting, and email notifications. We reserve the right to modify, suspend, or discontinue any part of our services at any time.\",\"title\":\"Description of Services\"},\"termination\":{\"content\":\"We may suspend or terminate your account if you violate these Terms, engage in fraudulent activity, or fail to pay subscription fees. Before any suspension, we will send you a notification explaining the issue and give you a chance to resolve it — except in cases of serious violations (such as selling illegal items) where immediate action is required for safety. You may delete your account at any time through your dashboard settings. Upon termination, your store will be taken offline and your data will be retained for 30 days before permanent deletion. We are not liable for any loss of data resulting from account termination.\",\"title\":\"Account Termination\"},\"title\":\"Terms of Service\"}},\"nav\":{\"admin\":\"Admin\",\"dashboard\":\"Dashboard\",\"discover\":\"Marketplace\",\"features\":\"Features\",\"logi
